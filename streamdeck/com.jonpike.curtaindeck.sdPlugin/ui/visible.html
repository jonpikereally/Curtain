<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="row">
  <label>Item</label>
  <select name="key" data-items="movable"><option value="">Loading…</option></select>
</div>
<div class="row">
  <label>Press does</label>
  <select name="mode" data-default="toggle">
    <option value="toggle">Toggle</option>
    <option value="show">Keep on bar</option>
    <option value="hide">Hide it</option>
  </select>
</div>
<div class="row">
  <label>Show name</label>
  <input type="checkbox" name="showName" data-default="true">
</div>
<p class="hint">Same as the item's switch in Curtain's Settings. Lit while the item stays on the bar.</p>
<script src="pi.js"></script></body></html>
