<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="row">
  <label>Press does</label>
  <select name="mode" data-default="toggle">
    <option value="toggle">Toggle</option>
    <option value="show">Show all</option>
    <option value="hide">Hide again</option>
  </select>
</div>
<div class="row">
  <label>Stay open</label>
  <input type="checkbox" name="stay" data-default="false">
</div>
<p class="hint">Reveals every hidden icon on the menu bar, the same as option-clicking the arrow. They hide again after the delay set in Curtain's Settings, unless “Stay open” is ticked. Lit while they're showing.</p>
<script src="pi.js"></script></body></html>
